<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="喝水提醒">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4facfe">
    <title>喝水提醒</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
        .app{max-width:380px;width:100%;background:white;border-radius:25px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.3)}
        .header{background:linear-gradient(135deg,#4facfe,#00f2fe);padding:25px 20px;text-align:center;color:white}
        .header h1{font-size:24px;margin-bottom:15px}
        .cup{width:120px;height:160px;margin:0 auto;border:4px solid rgba(255,255,255,0.8);border-radius:0 0 25px 25px;position:relative;overflow:hidden;background:rgba(255,255,255,0.15)}
        .water{position:absolute;bottom:0;width:100%;background:linear-gradient(to top,#2196F3,#64B5F6);height:0%;transition:height 0.6s}
        .amount{font-size:32px;font-weight:bold;margin-top:10px}
        .goal{font-size:13px;opacity:0.85;margin-top:3px}
        .tip{font-size:11px;background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:12px;margin-top:8px}
        .content{padding:18px}
        .remind{background:#FFF9E6;border:2px solid #FFB300;border-radius:12px;padding:12px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
        .remind select{padding:5px 8px;border-radius:5px;border:1px solid #ddd;font-size:13px}
        .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}
        .btn{padding:14px;border:2px solid #e0e0e0;border-radius:12px;background:white;cursor:pointer;text-align:center;font-size:14px;font-weight:bold;transition:all 0.2s}
        .btn:active{border-color:#4facfe;background:#e3f2fd;transform:scale(0.95)}
        .custom{display:flex;gap:8px;margin-bottom:15px}
        .custom input{flex:1;padding:10px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px}
        .custom button{padding:10px 20px;background:#4facfe;color:white;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
        .stats{display:flex;justify-content:space-around;background:#f8f9fa;padding:12px;border-radius:10px;margin-bottom:15px}
        .stat{text-align:center}
        .stat-num{font-size:22px;font-weight:bold;color:#4facfe}
        .stat-label{font-size:11px;color:#666}
        .title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .clear-btn{background:#ff4444;color:white;border:none;padding:5px 12px;border-radius:12px;font-size:12px;cursor:pointer}
        .record{display:flex;justify-content:space-between;padding:10px;background:#f8f9fa;border-radius:8px;margin-bottom:5px;font-size:14px}
        .record .t{color:#666}
        .record .m{font-weight:bold;color:#4facfe}
        .record .d{color:#ff4444;cursor:pointer;font-weight:bold}
        .empty{text-align:center;color:#999;padding:25px;font-size:14px}
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>💧 喝水记录</h1>
            <div class="cup"><div class="water" id="wf"></div></div>
            <div class="amount"><span id="cur">0</span> ml</div>
            <div class="goal">今日目标: 2000ml | 上限: 5000ml</div>
            <div class="tip">⚠️ 健康建议：成人每日1500-2000ml，勿超5000ml</div>
        </div>
        <div class="content">
            <div class="remind">
                <span>🔔 喝水提醒</span>
                <select id="inv" onchange="sr()">
                    <option value="0">关闭</option>
                    <option value="30">每30分钟</option>
                    <option value="60" selected>每1小时</option>
                    <option value="120">每2小时</option>
                </select>
            </div>
            <div class="stats">
                <div class="stat"><div class="stat-num" id="cnt">0</div><div class="stat-label">喝水次数</div></div>
                <div class="stat"><div class="stat-num" id="rem">2000</div><div class="stat-label">还需ml</div></div>
                <div class="stat"><div class="stat-num" id="pct">0%</div><div class="stat-label">完成率</div></div>
            </div>
            <div class="btns">
                <button class="btn" onclick="ad(150)">🥛 150ml</button>
                <button class="btn" onclick="ad(250)">🍵 250ml</button>
                <button class="btn" onclick="ad(350)">☕ 350ml</button>
            </div>
            <div class="custom">
                <input type="number" id="cst" placeholder="自定义水量(50-500ml)" min="50" max="500">
                <button onclick="ac()">添加</button>
            </div>
            <div class="title-row">
                <strong>📝 今日记录</strong>
                <button class="clear-btn" onclick="clr()">🗑 一键清除</button>
            </div>
            <div id="his"></div>
        </div>
    </div>
    <script>
        function td(){return new Date().toDateString()}
        let sd=localStorage.getItem('d');
        let rs=[];
        if(sd===td()){rs=JSON.parse(localStorage.getItem('r')||'[]')}
        else{rs=[];localStorage.setItem('d',td())}
        let rt=null;
        function rf(){
            let t=0;rs.forEach(r=>t+=r.a);
            let p=Math.min((t/5000)*100,100);
            document.getElementById('wf').style.height=p+'%';
            document.getElementById('cur').textContent=t;
            document.getElementById('cnt').textContent=rs.length;
            document.getElementById('rem').textContent=Math.max(0,2000-t);
            document.getElementById('pct').textContent=Math.min(100,Math.round((t/2000)*100))+'%';
            let wf=document.getElementById('wf');
            if(t>=5000)wf.style.background='linear-gradient(to top,#f44336,#ef5350)';
            else if(t>=2000)wf.style.background='linear-gradient(to top,#ff9800,#ffb74d)';
            else wf.style.background='linear-gradient(to top,#2196F3,#64B5F6)';
            let h='';
            if(rs.length===0)h='<div class="empty">🥤 今天还没喝水哦~</div>';
            else for(let i=rs.length-1;i>=0;i--)h+='<div class="record"><span class="t">🕐 '+rs[i].t+'</span><span class="m">💧 '+rs[i].a+'ml</span><span class="d" onclick="dl('+i+')">✕</span></div>';
            document.getElementById('his').innerHTML=h;
            localStorage.setItem('r',JSON.stringify(rs));
            localStorage.setItem('d',td());
        }
        function ad(a){
            let t=0;rs.forEach(r=>t+=r.a);
            if(t>=5000){alert('已达到每日上限5000ml！');return}
            if(t+a>5000)a=5000-t;
            let n=new Date();
            let tm=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
            rs.push({a:a,t:tm});rf();
            if(navigator.vibrate)navigator.vibrate(30);
        }
        function ac(){
            let i=document.getElementById('cst');
            let a=parseInt(i.value);
            if(!a||a<=0)return;
            if(a>500){alert('单次最多500ml');return}
            ad(a);i.value='';
        }
        function dl(i){rs.splice(i,1);rf()}
        function clr(){if(rs.length===0)return;if(confirm('确定清除今天所有记录吗？')){rs=[];rf()}}
        function sr(){
            let i=parseInt(document.getElementById('inv').value);
            if(rt){clearInterval(rt);rt=null}
            if(i>0){
                rt=setInterval(function(){
                    let n=new Date();
                    let h=n.getHours();
                    if(h>=8&&h<=22){
                        let t=0;rs.forEach(r=>t+=r.a);
                        let r=2000-t;
                        if(r>0&&Notification.permission==='granted'){
                            new Notification('💧 该喝水啦！',{body:'还需补充 '+r+'ml 水分',icon:'💧'});
                        }
                    }
                },i*60*1000);
            }
        }
        if(Notification.permission==='default')Notification.requestPermission();
        document.getElementById('cst').addEventListener('keypress',function(e){if(e.key==='Enter')ac()});
        rf();sr();
    </script>
</body>
</html>
